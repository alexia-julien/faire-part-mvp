<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Suivi des réponses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="admin-page">
<main class="admin">
  <h1>Suivi des réponses</h1>
  <p id="state" class="muted">Chargement…</p>
  <div id="content" hidden>
    <div class="tiles" id="tiles"></div>
    <div class="actions">
      <a class="btn-ghost" id="open-public" target="_blank" rel="noopener">Voir le faire-part</a>
      <a class="btn-ghost" id="edit-link">Modifier le faire-part</a>
      <button type="button" class="btn-ghost" id="csv">Exporter en CSV</button>
      <button type="button" class="btn-ghost" id="refresh">Actualiser</button>
    </div>
    <div class="table-wrap">
      <table id="table">
        <thead><tr><th>Reçu le</th><th>Nom</th><th>Présence</th><th>Pers.</th><th>Brunch</th><th>Régime</th><th>Message</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="muted" id="empty" hidden>Aucune réponse pour l’instant. Partagez le lien du faire-part pour recevoir les premières.</p>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
